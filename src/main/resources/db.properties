# Database configuration for SGMS (direct JDBC fallback when JNDI is unavailable).
# Do NOT commit real credentials. Override with environment variables:
#   DB_URL, DB_USER, DB_PASSWORD

db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/sgms?useSSL=false&serverTimezone=Africa/Nairobi&useUnicode=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
db.username=
db.password=

# Connection Pool Settings (if using direct JDBC fallback)
db.pool.initialSize=5
db.pool.maxActive=20
db.pool.maxIdle=10
db.pool.minIdle=2
db.pool.maxWait=10000
